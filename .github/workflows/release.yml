# Bygger en binær pr. platform, når et tag som v1.2.3 pushes, og lægger dem
# sammen med thehome.json på en GitHub-release. TheHome installerer derfra.
# Go krydskompilerer statisk (CGO_ENABLED=0), så én runner bygger det hele.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # domænet fra thehome.json og pakken med main
  DOMAIN: example_counter_go
  MAIN: ./cmd/example_counter_go

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Byg
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          # GOOS/GOARCH og Rust-target-navnet, som TheHome leder efter
          while read -r goos goarch target ext; do
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/$DOMAIN-$target$ext" "$MAIN"
          done <<'TARGETS'
          windows amd64 x86_64-pc-windows-msvc .exe
          linux amd64 x86_64-unknown-linux-musl
          linux arm64 aarch64-unknown-linux-musl
          darwin amd64 x86_64-apple-darwin
          darwin arm64 aarch64-apple-darwin
          TARGETS
          ls -l dist
      - if: startsWith(github.ref, 'refs/tags/')
        # A release published on github.com already exists; then only add the files.
        run: |
          # release notes: the commit subjects since the previous tag
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then echo "## Ændringer siden $prev"; else echo "## Ændringer"; fi
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
          } > notes.md
          cat notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* thehome.json --clobber
            # keep notes written on github.com, fill in an empty release
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* thehome.json --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
